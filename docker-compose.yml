services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-accessibility-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      WEBAPP_MONGO_URL: mongodb://mongodb:27017
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/app/.env:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auth-accessibility-frontend
    restart: unless-stopped
    depends_on:
      - app
    environment:
      HOST: 0.0.0.0
      BACKEND_PROXY: http://app:8080
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"

  mongodb:
    image: mongo:7
    container_name: auth-accessibility-mongo
    restart: unless-stopped
    ports:
      - "27020:27017"
    command: ["--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
